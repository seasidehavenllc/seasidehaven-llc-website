# Render's free plan puts the booking server to sleep after 15 minutes without
# traffic. This pings it every 10 minutes so the chat shows open times right away.
name: Keep booking server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the booking server
        run: curl -fsS --max-time 90 --retry 2 https://seaside-booking.onrender.com/health
